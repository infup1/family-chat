            padding: 18px 14px;

            flex-shrink: 0;

        }
        .brand-avatar {

            height: 36px;

            color: #fafaf9;

            justify-content: center;
            font-size: 15px;
            font-weight: 600;
        }

            border: 1px solid var(--border-light);
            border-radius: var(--radius-inner);
            padding: 10px 12px;

            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .sync-row {
            display: flex;
            align-items: center;

            font-size: 11.5px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            background: #eab308;
        }

        .btn-sync-action {
            background: none;
            border: none;
            color: #2563eb;
            font-size: 11px;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
        }

        .section-label {

            font-weight: 700;
            color: var(--text-subtle);
            padding: 8px 8px 4px;
            letter-spacing: 0.6px;
            text-transform: uppercase;
